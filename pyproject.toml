[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcmas"
version = "1.0.0"
description = "Region Control Multi-Agent System: SMT-based Nash equilibrium synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "z3-solver",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rcmas = "rcmas.cli:main"

[tool.setuptools.packages.find]
include = ["rcmas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
