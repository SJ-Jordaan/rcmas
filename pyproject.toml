[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcmas"
version = "2.0.0"
description = "Region Control Multi-Agent System: SMT-based Nash equilibrium synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# z3-solver is pinned exactly: the results of thesis Chapter 7 depend on the
# solver version (README, "Reproducing the thesis experiments").
dependencies = [
    "z3-solver==5.3.3.0",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rcmas = "rcmas.cli:main"

[tool.setuptools.packages.find]
include = ["rcmas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
