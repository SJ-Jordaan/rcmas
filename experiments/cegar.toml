# CEGAR partition comparison experiments
#
# Compares three initial partition strategies (discrete, uniform grid tiling,
# BFS k-way) across multiple grid sizes and agent counts.  Direct IBIS/S-IBIS
# synthesis is included as the no-abstraction baseline.
#
# Usage:
#   python -m experiments.run --config experiments/cegar.toml --output cegar.jsonl
#   python -m experiments.run --config experiments/cegar.toml --list

[suite]
name = "cegar"

[grids]
symmetric = [
    "3x2.txt",
    "4x2.txt",
    "3x3.txt",
    "4x3.txt",
    "4x4.txt",
    "5x3.txt",
    "5x4.txt",
    "6x3.txt",
    "6x4.txt",
    "5x5.txt",
    "6x5.txt",
    "6x6.txt"
]

[parameters]
agents = [2, 3, 4, 5]
algorithms = ["sibis", "cegar-sibis"]
partitions = ["discrete", "grid-2x2", "grid-3x3", "bfs-4", "bfs-6", "bfs-8", "balanced"]
symmetry = [false]
