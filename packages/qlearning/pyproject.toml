[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qlearning-territory"
version = "0.1.0"
description = "Territory capture game simulation + Q-learning trainer"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "" }]
dependencies = [
	# Installed as an editable sibling package in this workspace.
	# Keep qlearning's runtime import surface stable without hard-coding local paths.
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
