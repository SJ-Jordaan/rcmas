[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcmas-testbeds"
version = "0.1.0"
description = "Experiment runners/testbeds for RCMAS solving approaches"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "" }]
dependencies = [
    # Installed as an editable sibling package in this workspace.
    "z3-solver",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rcmas-testbeds = "rcmas_testbeds.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
